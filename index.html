<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ديواني</title>
<meta name="description" content="ديوان شعر">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a single centered reading column, like pages of a bound diwan; poems sit on leather-toned sheets framed by a thin gold rule. */
:root{
  --bg:#2a1a12; --bg-2:#3a2519; --sheet:#4a3022; --sheet-edge:#5e3e2c;
  --ink:#f1e4d2; --ink-soft:#c9b29a; --ink-faint:#9a8069;
  --gold:#d4a94e; --gold-soft:#a9843a; --danger:#e08a6e;
  --f-poem:"Amiri","Noto Naskh Arabic","Times New Roman",serif;
  --f-name:"Aref Ruqaa","Amiri",serif;
  --f-head:"Reem Kufi","Amiri",serif;
  --f-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;
  background-image:radial-gradient(ellipse at top,var(--bg-2),var(--bg) 70%);min-height:100vh}
#root{max-width:760px;margin:0 auto;padding-block:48px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:40px}
header.mast{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.orn{color:var(--gold);font-family:var(--f-poem);font-size:30px;line-height:1;opacity:.9;text-shadow:0 0 18px rgba(212,169,78,.35)}
.name-wrap{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,24px);width:100%}
.rule{flex:1;max-width:160px;height:1px;position:relative;background:linear-gradient(to left,transparent,var(--gold-soft) 40%,var(--gold))}
.rule.r{background:linear-gradient(to right,transparent,var(--gold-soft) 40%,var(--gold))}
.rule::after{content:"";position:absolute;top:50%;width:7px;height:7px;background:var(--gold);transform:translateY(-50%) rotate(45deg)}
.rule.l::after{left:-3px}.rule.r::after{right:-3px}
h1{font-family:var(--f-name);font-weight:700;font-size:clamp(64px,16vw,112px);line-height:1.35;margin:0;padding-inline:.08em;text-wrap:balance;
  color:var(--gold);background:linear-gradient(100deg,#9c7330 0%,#e9c977 28%,#fff1c4 45%,#d4a94e 60%,#8f6828 100%);background-size:220% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.45)) drop-shadow(0 0 22px rgba(212,169,78,.25))}
@media (prefers-reduced-motion:no-preference){h1{animation:gild 2.8s ease-out .2s both}@keyframes gild{from{background-position:0 0}to{background-position:100% 0}}}
.tag{font-family:var(--f-poem);font-size:20px;color:var(--ink-soft);margin:0;text-wrap:balance}
.count{font-size:13px;color:var(--ink-faint);letter-spacing:.02em}
nav.toc{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;font-family:var(--f-poem);font-size:18px}
nav.toc a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid transparent}
nav.toc a:hover,nav.toc a:focus-visible{color:var(--gold);border-color:var(--gold-soft);outline:none}
.poems{display:flex;flex-direction:column;gap:36px}
article.poem{background:var(--sheet);border:1px solid var(--sheet-edge);border-radius:4px;padding:40px clamp(18px,5vw,48px) 32px;position:relative;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.6)}
article.poem::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold-soft);border-radius:2px;opacity:.45;pointer-events:none}
article.poem h2{font-family:var(--f-head);font-weight:500;font-size:28px;color:var(--gold);text-align:center;margin:0 0 6px;text-wrap:balance}
.meta{text-align:center;font-size:13px;color:var(--ink-faint);margin-bottom:26px}
.verses{font-family:var(--f-poem);font-size:clamp(19px,4.4vw,23px);line-height:2.1;color:var(--ink);display:flex;flex-direction:column}
.bayt{display:grid;grid-template-columns:1fr auto 1fr;gap:0 18px;align-items:baseline}
.bayt .sadr{text-align:left}.bayt .ajz{text-align:right}
.bayt .sep{color:var(--gold-soft);font-size:.7em}
.free{text-align:center}
.gap{height:.9em}
@media (max-width:520px){.bayt{grid-template-columns:1fr;text-align:center}.bayt .sadr,.bayt .ajz{text-align:center}.bayt .sep{display:none}.bayt .ajz{margin-bottom:.4em}}
.end{text-align:center;color:var(--gold);margin-top:22px;font-size:18px;opacity:.8}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--sheet-edge);border-radius:4px;color:var(--ink-soft);font-family:var(--f-poem);font-size:20px}
.empty small{display:block;font-family:var(--f-ui);font-size:14px;color:var(--ink-faint);margin-top:8px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--bg-2);border:1px solid var(--sheet-edge);border-radius:4px;padding:12px 16px}
.bar .who{font-size:14px;color:var(--ink-soft)}
.bar .who b{color:var(--gold);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:var(--f-ui);font-size:14px;font-weight:500;cursor:pointer;border-radius:3px;padding:8px 14px;border:1px solid var(--gold-soft);background:transparent;color:var(--gold)}
button:hover{background:rgba(212,169,78,.1)}
button.primary{background:var(--gold);color:var(--bg);border-color:var(--gold)}
button.primary:hover{background:#e2ba62}
button.danger{border-color:var(--danger);color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tools{display:flex;justify-content:center;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
form.editor{background:var(--bg-2);border:1px solid var(--gold-soft);border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:14px}
form.editor h3{margin:0;font-family:var(--f-head);font-weight:500;color:var(--gold);font-size:22px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-soft)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--sheet-edge);border-radius:3px;padding:10px 12px;width:100%}
input.ltr{direction:ltr;text-align:left}
textarea{font-family:var(--f-poem);font-size:20px;line-height:1.9;min-height:260px;resize:vertical}
.hint{font-size:13px;color:var(--ink-faint);margin:0}
.hint code{color:var(--gold);font-family:inherit}
.hint a{color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.status{font-size:14px;color:var(--ink-soft);min-height:1.4em}
.status.err{color:var(--danger)}
footer{text-align:center;font-size:13px;color:var(--ink-faint)}
@media (prefers-reduced-motion:no-preference){article.poem{animation:rise .5s ease both}@keyframes rise{from{transform:translateY(8px)}to{transform:none}}}
</style>
</head>
<body>
<div id="root"><header class="mast"><div class="orn" aria-hidden="true">۞</div><div class="name-wrap"><span class="rule l" aria-hidden="true"></span><h1>ديواني</h1><span class="rule r" aria-hidden="true"></span></div></header></div>
<script>
(function(){
  // Where the poems live. Only someone with write access to this repository can save.
  var OWNER='amar1010900', REPO='diwani', FILE='poems.json';
  var API='https://api.github.com/repos/'+OWNER+'/'+REPO;
  var TOKEN_KEY='diwani-token', DRAFT='diwani-draft';

  var root=document.getElementById('root');
  var state={name:'ديواني',tagline:'',poems:[]}, sha=null, loaded=false, loadErr=false;
  var token=null, isOwner=false, editing=null, confirmDel=null, editingHead=false, busy=false, msg='', msgErr=false;
  try{token=localStorage.getItem(TOKEN_KEY)}catch(e){}

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmtDate(iso){try{return new Date(iso).toLocaleDateString('ar-SA-u-ca-gregory',{year:'numeric',month:'long',day:'numeric'})}catch(e){return ''}}
  function toB64(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
  function fromB64(b64){var bin=atob(b64.replace(/\s/g,''));var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
  function gh(path,opts){
    opts=opts||{};opts.headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};
    opts.cache='no-store';
    return fetch(API+path,opts);
  }

  function verses(text){
    var out='';
    String(text).replace(/\r/g,'').split('\n').forEach(function(l){
      var t=l.trim();
      if(!t){out+='<div class="gap"></div>';return}
      var i=t.indexOf('*');
      if(i>-1){out+='<div class="bayt"><span class="sadr">'+esc(t.slice(0,i).trim())+'</span><span class="sep">✦</span><span class="ajz">'+esc(t.slice(i+1).trim())+'</span></div>'}
      else out+='<div class="free">'+esc(t)+'</div>';
    });
    return out;
  }

  function editorForm(p){
    var d=p||{title:'',text:''};
    try{var dr=JSON.parse(sessionStorage.getItem(DRAFT)||'null');if(dr&&dr.id===(p?p.id:'new')){d=dr}}catch(e){}
    return '<form class="editor" id="ed"><h3>'+(p?'تعديل القصيدة':'قصيدة جديدة')+'</h3>'+
      '<label for="ed-title">العنوان<input id="ed-title" required maxlength="120" value="'+esc(d.title)+'"></label>'+
      '<label for="ed-text">الأبيات<textarea id="ed-text" required>'+esc(d.text)+'</textarea></label>'+
      '<p class="hint">للبيت العمودي افصل الصدر عن العجز بعلامة <code>*</code> ، وسطر فارغ يفصل بين المقاطع.</p>'+
      '<div class="row"><button type="submit" class="primary"'+(busy?' disabled':'')+'>نشر</button><button type="button" data-act="cancel">إلغاء</button></div></form>';
  }

  function loginForm(){
    return '<form class="editor" id="login"><h3>دخول صاحب الديوان</h3>'+
      '<label for="tok">مفتاح GitHub<input id="tok" class="ltr" type="password" autocomplete="off" spellcheck="false" required></label>'+
      '<p class="hint">المفتاح يُحفظ في هذا المتصفح فقط. أنشئه من <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">إعدادات GitHub</a>: اختر المستودع <code>'+REPO+'</code> فقط، وصلاحية Contents: Read and write.</p>'+
      '<div class="row"><button type="submit" class="primary"'+(busy?' disabled':'')+'>دخول</button></div>'+
      '<div class="status'+(msgErr?' err':'')+'" role="status">'+esc(msg)+'</div></form>';
  }

  function render(){
    var n=state.poems.length;
    var h='<header class="mast"><div class="orn" aria-hidden="true">۞</div><div class="name-wrap"><span class="rule l" aria-hidden="true"></span><h1>'+esc(state.name)+'</h1><span class="rule r" aria-hidden="true"></span></div>'+
      (state.tagline?'<p class="tag">'+esc(state.tagline)+'</p>':'')+
      '<div class="count">'+(n?n+' '+(n===1?'قصيدة':n===2?'قصيدتان':n<=10?'قصائد':'قصيدة'):'')+'</div></header>';
    if(isOwner){
      h+='<div class="bar"><span class="who">أنت <b>صاحب الديوان</b>. الزوار يقرؤون فقط.</span><div class="btns">'+
        '<button class="primary" data-act="new"'+(editing||busy?' disabled':'')+'>قصيدة جديدة</button>'+
        '<button data-act="head"'+(busy?' disabled':'')+'>تعديل العنوان</button>'+
        '<button data-act="logout">خروج</button></div></div>';
      if(editingHead){
        h+='<form class="editor" id="hd"><h3>عنوان الديوان</h3><label for="hd-name">الاسم<input id="hd-name" required maxlength="60" value="'+esc(state.name)+'"></label>'+
          '<label for="hd-tag">سطر التعريف<input id="hd-tag" maxlength="140" value="'+esc(state.tagline)+'"></label>'+
          '<div class="row"><button type="submit" class="primary"'+(busy?' disabled':'')+'>حفظ</button><button type="button" data-act="cancel">إلغاء</button></div></form>';
      }
      if(editing==='new')h+=editorForm(null);
      h+='<div class="status'+(msgErr?' err':'')+'" role="status">'+esc(msg)+'</div>';
    }else if(location.hash==='#write'){
      h+=loginForm();
    }
    if(n>2){
      h+='<nav class="toc" aria-label="فهرس القصائد">'+state.poems.map(function(p){return '<a href="#p-'+esc(p.id)+'">'+esc(p.title)+'</a>'}).join('')+'</nav>';
    }
    if(!loaded){
      h+='<div class="empty">'+(loadErr?'تعذّر تحميل القصائد<small>حدّث الصفحة بعد قليل.</small>':'جارٍ تحميل القصائد…')+'</div>';
    }else if(!n){
      h+='<div class="empty">لم تُنشر قصائد بعد'+(isOwner?'<small>اضغط «قصيدة جديدة» لكتابة أول قصيدة، وستظهر هنا للجميع.</small>':'<small>عُد قريبًا.</small>')+'</div>';
    }else{
      h+='<div class="poems">'+state.poems.map(function(p){
        if(isOwner&&editing===p.id)return editorForm(p);
        var tools='';
        if(isOwner){
          tools=confirmDel===p.id
            ?'<div class="tools"><span class="hint">حذف هذه القصيدة نهائيًا؟</span><button class="danger" data-act="del-yes" data-id="'+esc(p.id)+'">نعم، احذف</button><button data-act="del-no">تراجع</button></div>'
            :'<div class="tools"><button data-act="edit" data-id="'+esc(p.id)+'"'+(editing||busy?' disabled':'')+'>تعديل</button><button class="danger" data-act="del" data-id="'+esc(p.id)+'"'+(busy?' disabled':'')+'>حذف</button></div>';
        }
        return '<article class="poem" id="p-'+esc(p.id)+'"><h2>'+esc(p.title)+'</h2><div class="meta">'+esc(fmtDate(p.date))+'</div>'+
          '<div class="verses">'+verses(p.text)+'</div><div class="end" aria-hidden="true">۞</div>'+tools+'</article>';
      }).join('')+'</div>';
    }
    h+='<footer>جميع القصائد محفوظة لكاتبها</footer>';
    root.innerHTML=h;
    document.title=state.name||'ديواني';
  }

  function setState(data){
    state={name:data.name||'ديواني',tagline:data.tagline||'',poems:Array.isArray(data.poems)?data.poems:[]};
    loaded=true;loadErr=false;
  }

  // Visitors read the published file; the owner reads straight from the repository so edits show at once.
  function loadPublic(){
    return fetch(FILE+'?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(d){setState(d)},function(){loaded=false;loadErr=true});
  }
  function loadOwner(){
    return gh('/contents/'+FILE).then(function(r){if(!r.ok)throw r.status;return r.json()})
      .then(function(j){sha=j.sha;setState(JSON.parse(fromB64(j.content)))});
  }
  function checkToken(){
    return gh('').then(function(r){if(!r.ok)throw r.status;return r.json()})
      .then(function(repo){if(!repo.permissions||!repo.permissions.push)throw 403;isOwner=true;return loadOwner()});
  }

  function save(next,done){
    busy=true;msg='جارٍ النشر…';msgErr=false;render();
    var body={message:'تحديث الديوان',content:toB64(JSON.stringify(next,null,2)+'\n'),sha:sha};
    gh('/contents/'+FILE,{method:'PUT',body:JSON.stringify(body)}).then(function(r){
      if(r.status===409||r.status===422)throw 'conflict';
      if(r.status===401||r.status===403)throw 'auth';
      if(!r.ok)throw 'other';
      return r.json();
    }).then(function(j){
      sha=j.content.sha;setState(next);
      try{sessionStorage.removeItem(DRAFT)}catch(e){}
      if(done)done();
      busy=false;msg='تم النشر. تظهر للزوار خلال دقيقة أو دقيقتين.';render();
    },function(code){
      busy=false;msgErr=true;
      if(code==='conflict'){msg='تغيّر الملف من مكان آخر. حمّلت أحدث نسخة، أعد المحاولة.';loadOwner().then(render,render);return}
      if(code==='auth'){msg='المفتاح لم يعد صالحًا. اخرج وادخل بمفتاح جديد.'}
      else msg='تعذّر النشر. مسودتك محفوظة، جرّب مرة أخرى.';
      render();
    });
  }

  root.addEventListener('click',function(e){
    var b=e.target.closest('button[data-act]');if(!b)return;
    var a=b.dataset.act,id=b.dataset.id;
    if(a==='new'){editing='new';editingHead=false}
    else if(a==='edit'){editing=id;editingHead=false}
    else if(a==='head'){editingHead=!editingHead;editing=null}
    else if(a==='cancel'){editing=null;editingHead=false;try{sessionStorage.removeItem(DRAFT)}catch(x){}}
    else if(a==='del'){confirmDel=id}
    else if(a==='del-no'){confirmDel=null}
    else if(a==='del-yes'){var n=JSON.parse(JSON.stringify(state));n.poems=n.poems.filter(function(p){return p.id!==id});confirmDel=null;save(n);return}
    else if(a==='logout'){try{localStorage.removeItem(TOKEN_KEY)}catch(x){}token=null;isOwner=false;editing=null;editingHead=false;history.replaceState(null,'',location.pathname);loadPublic().then(render);}
    msg='';msgErr=false;render();
    var f=root.querySelector('#ed-title,#hd-name');if(f)f.focus();
  });
  root.addEventListener('input',function(e){
    if(!e.target.closest('#ed'))return;
    try{sessionStorage.setItem(DRAFT,JSON.stringify({id:editing,title:document.getElementById('ed-title').value,text:document.getElementById('ed-text').value}))}catch(x){}
  });
  root.addEventListener('submit',function(e){
    e.preventDefault();
    if(e.target.id==='login'){
      token=document.getElementById('tok').value.trim();if(!token)return;
      busy=true;msg='جارٍ التحقق…';msgErr=false;render();
      checkToken().then(function(){
        try{localStorage.setItem(TOKEN_KEY,token)}catch(x){}
        busy=false;msg='';render();
      },function(){
        token=null;isOwner=false;busy=false;msgErr=true;msg='المفتاح غير صحيح أو لا يملك صلاحية الكتابة على المستودع '+REPO+'.';render();
      });
      return;
    }
    var n=JSON.parse(JSON.stringify(state));
    if(e.target.id==='hd'){n.name=document.getElementById('hd-name').value.trim()||state.name;n.tagline=document.getElementById('hd-tag').value.trim();save(n,function(){editingHead=false});return}
    var t=document.getElementById('ed-title').value.trim(),x=document.getElementById('ed-text').value.replace(/\s+$/,'');
    if(!t||!x.trim()){msg='اكتب العنوان والأبيات قبل النشر.';msgErr=true;render();return}
    if(editing==='new')n.poems.unshift({id:Date.now().toString(36),title:t,text:x,date:new Date().toISOString()});
    else n.poems=n.poems.map(function(p){return p.id===editing?{id:p.id,title:t,text:x,date:p.date}:p});
    save(n,function(){editing=null});
  });
  window.addEventListener('hashchange',function(){if(!isOwner)render()});

  render();
  if(token){
    checkToken().then(render,function(){isOwner=false;loadPublic().then(render)});
  }else{
    loadPublic().then(render);
  }
})();
</script>
</body>
</html>
